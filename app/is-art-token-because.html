<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Is This Token Art?</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/bulma.css">
    <link rel="stylesheet" href="./css/is-art.css">
  </head>
  <body>

    <div id="representation" class="columns is-vcentered">
      <div id="is-art" class="column">
        <span id="is-art-definition">This token is art because of some reason</span>
      </div>
    </div>

    <div class="modal" id="updating">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="notification is-danger has-text-centered">
          <h1 class="title">Updating</h1>
          <h2 class="subtitle">Check Ethereum browser/plugin
            for status updates</h2>
        </div>
      </div>
    </div>

    <div class="modal" id="gui">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="box">
          <h1 class="title">Definition
            of Token <span id="set-token-id"></h1>
          <h2 class="subtitle">Select the "Update" button below
            to update the token's state.</h2>
          <div class="field">
            <div class="control is-expanded">
              <div class="select is-fullwidth">
                <select id="extent">
                  <option value="0">powerfully</option>
                  <option value="1">critically</option>
                  <option value="2">unprecedentedly</option>
                  <option value="3">shockingly</option>
                  <option value="4">ironically</option>
                  <option value="5">zanily</option>
                  <option value="6">interestingly</option>
                  <option value="7">cutely</option>
                  <option value="8">paradoxically</option>
                  <option value="9">evocatively</option>
                  <option value="10">skilfully</option>
                  <option value="11">cunningly</option>
                  <option value="12">allusively</option>
                  <option value="13">passionately</option>
                  <option value="14">deftly</option>
                  <option value="15">basedly</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field">
            <div class="control">
              <div class="select is-fullwidth">
                <select id="relation">
                  <option value="0">engages with</option>
                  <option value="1">extends</option>
                  <option value="2">explores the weltanschauung of</option>
                  <option value="3">interrogates</option>
                  <option value="4">draws its forms from</option>
                  <option value="5">embraces</option>
                  <option value="6">reacts to</option>
                  <option value="7">comments on</option>
                  <option value="8">indexes</option>
                  <option value="9">symbolically resolves</option>
                  <option value="10">embodies</option>
                  <option value="11">plays with</option>
                  <option value="12">sutures its content to</option>
                  <option value="13">expresses</option>
                  <option value="14">depicts</option>
                  <option value="15">diagrams</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field">
            <div class="control">
              <div class="select is-fullwidth">
                <select id="connection">
                  <option value="0">negative</option>
                  <option value="1">universal</option>
                  <option value="2">ontological</option>
                  <option value="3">epistemological</option>
                  <option value="4">historical</option>
                  <option value="5">psychological</option>
                  <option value="6">simplistic</option>
                  <option value="7">sophisticated</option>
                  <option value="8">conservative</option>
                  <option value="9">liberal</option>
                  <option value="10">ironic</option>
                  <option value="11">creepy</option>
                  <option value="12">radical</option>
                  <option value="13">queer</option>
                  <option value="14">racialised</option>
                  <option value="15">trans</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field">
            <div class="control">
              <div class="select is-fullwidth">
                <select id="subject">
                  <option value="0">specificity</option>
                  <option value="1">techne</option>
                  <option value="2">society</option>
                  <option value="3">politics</option>
                  <option value="4">materiality</option>
                  <option value="5">identity</option>
                  <option value="6">affect</option>
                  <option value="7">understanding</option>
                  <option value="8">aesthetics</option>
                  <option value="9">theology</option>
                  <option value="10">demonology</option>
                  <option value="11">beauty</option>
                  <option value="12">horror</option>
                  <option value="13">desire</option>
                  <option value="14">critique</option>
                  <option value="15">universality</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field is-grouped">
            <div class="control">
              <button type="button" class="button is-success"
                      id="toggle-button">Update</button>
            </div>
            <div class="control">
              <button type="button" class="button is-info"
                      id="cancel-button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/is-art-token-because.js"></script>
  </body>
</html>
