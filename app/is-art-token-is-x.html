<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Is This Token Art?</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/bulma.css">
    <link rel="stylesheet" href="./css/is-art.css">
  </head>
  <body>

    <div id="representation" class="columns is-vcentered">
      <div id="is-art" class="column">
        This token is art because<br>
        <span id="is-art-description">of some reason</span>.</div>
    </div>

    <div class="modal" id="updating">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="notification is-danger has-text-centered">
          <h1 class="title">Updating</h1>
          <h2 class="subtitle">Check Ethereum browser/plugin
            for status updates</h2>
        </div>
      </div>
    </div>

    <div class="modal" id="gui">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="box">
          <h1 class="title">Definition
            of Token <span id="set-token-id"></h1>
          <h2 class="subtitle">Select the "Update" button below
            to update the token's state.</h2>
          <div class="field is-grouped">
            <div class="select">
              <select id="extent">
                <option value="0">it is</option>
                <option value="1">it competently critiques</option>
                <option value="2">it expresses</option>
                <option value="3">it interrogates</option>
                <option value="4">it ironises</option>
                <option value="5">it is zanily</option>
                <option value="6">it is interestingly</option>
                <option value="7">it is cutely</option>
                <option value="8">it is paradoxically</option>
                <option value="9">it concerns</option>
                <option value="10">it represents</option>
                <option value="11">its aesthetic value lies in</option>
                <option value="12">it skilfully alludes to</option>
                <option value="13">it passionately evokes</option>
                <option value="14">it deftly realises</option>
                <option value="15">no other artwork is as</option>
                ];
              </select>
            </div>
            <div class="select">
              <select id="connection">
                <option value="0">not</option>
                <option value="1">universally</option>
                <option value="2">ontologically</option>
                <option value="3">epistemologically</option>
                <option value="4">logically</option>
                <option value="5">psychologically</option>
                <option value="6">childishly</option>
                <option value="7">sophisticatedly</option>
                <option value="8">conservatively</option>
                <option value="9">liberally</option>
                <option value="10">ironically</option>
                <option value="11">creepily</option>
                <option value="12">radically</option>
                <option value="13">queerly</option>
                <option value="14">problematically</option>
                <option value="15">neoliberally</option>
              </select>
            </div>
            <div class="select">
              <select id="relation">
                <option value="0">engaging with</option>
                <option value="1">reliant on</option>
                <option value="2">derivative of</option>
                <option value="3">determined by</option>
                <option value="4">defined by</option>
                <option value="5">embracing of</option>
                <option value="6">reacting to</option>
                <option value="7">commenting on</option>
                <option value="8">embracing</option>
                <option value="9">resolving</option>
                <option value="10">transcending</option>
                <option value="11">valenced by</option>
                <option value="12">critiquing</option>
                <option value="13">attacking</option>
                <option value="14">destroying</option>
                <option value="15">obviating</option>
              </select>
            </div>
            <div class="select">
              <select id="subject">
                <option value="0">specificity</option>
                <option value="1">techne</option>
                <option value="2">society</option>
                <option value="3">politics</option>
                <option value="4">materiality</option>
                <option value="5">identity</option>
                <option value="6">emotion</option>
                <option value="7">critique</option>
                <option value="8">aesthetics</option>
                <option value="9">god</option>
                <option value="10">satan</option>
                <option value="11">beauty</option>
                <option value="12">horror</option>
                <option value="13">desire</option>
                <option value="14">critique</option>
                <option value="15">universality</option>
              </select>
            </div>
          </div>
          <div class="field is-grouped">
            <div class="control">
              <button type="button" class="button is-success"
                      id="toggle-button">Update</button>
            </div>
            <div class="control">
              <button type="button" class="button is-info"
                      id="cancel-button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/is-art-token-is-x.js"></script>
  </body>
</html>
