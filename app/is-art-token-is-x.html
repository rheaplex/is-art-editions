<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Is This Token Art?</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/bulma.css">
    <link rel="stylesheet" href="./css/is-art.css">
  </head>
  <body>

    <div id="representation" class="columns is-vcentered">
      <div id="is-art" class="column">
        This<br>
        token is<br>
        <span id="is-art-status">something</span></div>
    </div>

    <div class="modal" id="updating">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="notification is-danger has-text-centered">
          <h1 class="title">Updating</h1>
          <h2 class="subtitle">Check Ethereum browser/plugin for status updates</h2>
        </div>
      </div>
    </div>

    <div class="modal" id="gui">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="box">
          <h1 class="title">Toggle</h1>
          <h2 class="subtitle">Select the "Toggle" button below to update the
            token's state.</h2>
          <div class="field">
            <div class="select">
              <select id="new-is">
                <option value="0">art</option>
                <option value="1">non-art</option>
                <option value="2">painting</option>
                <option value="3">sculpture</option>
                <option value="4">conceptual art</option>
                <option value="5">architecture</option>
                <option value="6">installation art</option>
                <option value="7">body art</option>
                <option value="8">performance art</option>

                <option value="9">performance</option>
                <option value="10">theatre</option>
                <option value="11">music</option>
                <option value="12">dance</option>
                <option value="13">cinema</option>
                <option value="14">opera</option>
                <option value="15">television</option>

                <option value="16">drama</option>
                <option value="17">literature</option>
                <option value="18">poetry</option>
                <option value="19">prose</option>
                <option value="20">fiction</option>

                <option value="21">video art</option>
                <option value="22">new media art</option>
                <option value="23">a video game</option>
                <option value="24">generative art</option>
                <option value="25">net art</option>
                <option value="26">digital art</option>
                <option value="27">photography</option>

                <option value="28">techne</option>
                <option value="29">aesthetic</option>
                <option value="30">gesamtkunstwerk</option>
                <option value="31">critique</option>

                <option value="32">nft art</option>
              </select>
            </div>
          </div>
          <div class="field is-grouped">
            <div class="control">
              <button type="button" class="button is-success"
                      id="toggle-button">Toggle</button>
            </div>
            <div class="control">
              <button type="button" class="button is-info"
                      id="cancel-button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/is-art-token-is-x.js"></script>
  </body>
</html>
