<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Is This Token Art?</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/bulma.css">
    <link rel="stylesheet" href="./css/is-art.css">
  </head>
  <body>

    <div id="representation" class="columns is-vcentered">
      <div id="is-art" class="column">
        This<br>
        token<br>
        <span id="is-art-status">may be</span> art</div>
    </div>

    <div class="modal" id="updating">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="notification is-danger has-text-centered">
          <h1 class="title">Updating</h1>
          <h2 class="subtitle">Check Ethereum browser/plugin for status updates</h2>
        </div>
      </div>
    </div>

    <div class="modal" id="gui">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="box">
          <h1 class="title">Display</h1>
          <div class="field is-grouped">
            <div class="control">
              <label for="tokens">Token:</label>
              <select name="tokens" id="tokens">
              </select>
            </div>
          </div>
          <div class="field is-grouped">
            <div class="control">
              <button type="button" class="button is-info"
                      id="cancel-button">Done</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/is-art-token-composition.js"></script>
  </body>
</html>
