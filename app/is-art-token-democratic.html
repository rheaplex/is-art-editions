<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Is This Token Art?</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/bulma.css">
    <link rel="stylesheet" href="./css/is-art.css">
  </head>
  <body>

    <div id="representation" class="columns is-vcentered">
      <div class="column">
        <div id="is-art">
        This<br>
        token<br>
        <span id="is-art-status">may be</span> art<br>
        by <span id="majority">N</span> to <span id="minority">M</span><br>
        votes<br>
        </div>
        <p style="font-family: 'Open Sans', sans-serif; text-align: center">
          Token ID #<span id="token-id">x</span>
          votes that it
          <span style="color: #550000" id="token-status">may be</span> art.</p>
      </div>
    </div>

    <div class="modal" id="updating">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="notification is-danger has-text-centered">
          <h1 class="title">Updating</h1>
          <h2 class="subtitle">Check Ethereum browser/plugin for status updates</h2>
        </div>
      </div>
    </div>

    <div class="modal" id="gui">
      <div class="modal-background"></div>
      <div class="modal-content">
        <div class="box">
          <h1 class="title">Toggle</h1>
          <h2 class="subtitle">Select the "Toggle" button below to update the
            token ID's vote.</h2>
          <div class="field is-grouped">
            <div class="control">
              <button type="button" class="button is-success"
                      id="toggle-button">Toggle</button>
            </div>
            <div class="control">
              <button type="button" class="button is-info"
                      id="cancel-button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/is-art-token-democratic.js"></script>
  </body>
</html>
